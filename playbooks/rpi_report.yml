---
- name: Raport Raspberry Pi - firmware, sprzet, Linux
  hosts: all
  gather_facts: false
  ignore_unreachable: true

  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ServerAliveInterval=5 -o ServerAliveCountMax=1"
    ansible_command_timeout: 20

  tasks:
    - name: Ustal IP i lokalizacje
      ansible.builtin.set_fact:
        rpi_ip: "{{ ansible_host | default(inventory_hostname) }}"
        rpi_lokalizacja: >-
          {% set ip = ansible_host | default(inventory_hostname) %}
          {% if ip.startswith('10.10.') %}
          SZWALNIA DM
          {% elif ip.startswith('10.237.') %}
          SZWALNIA RE
          {% elif ip.startswith('10.238.') %}
          SZWALNIA OL
          {% else %}
          INNE
          {% endif %}

    - name: Pokaz host start
      ansible.builtin.debug:
        msg: "Host={{ inventory_hostname }} IP={{ rpi_ip }} Lokalizacja={{ rpi_lokalizacja | trim }}"

    - name: Sprawdz polaczenie SSH
      ansible.builtin.wait_for_connection:
        timeout: 8
        connect_timeout: 5
        sleep: 1
      register: ssh_check
      ignore_errors: true

    - name: Ustaw raport dla hosta bez polaczenia
      ansible.builtin.set_fact:
        rpi_report:
          status: "BRAK POLACZENIA"
          lokalizacja: "{{ rpi_lokalizacja | trim }}"
          ip: "{{ rpi_ip }}"
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: ""
          model: ""
          revision: ""
          serial: ""
          linux: ""
          kernel: ""
          arch: ""
          bootloader: ""
          vcgencmd: ""
      when: ssh_check is failed

    - name: Pobierz hostname
      ansible.builtin.command: hostname
      register: cmd_hostname
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz model Raspberry Pi
      ansible.builtin.shell: |
        if [ -r /proc/device-tree/model ]; then
          tr -d '\0' < /proc/device-tree/model
        else
          awk -F': ' '/Model/ {print $2}' /proc/cpuinfo | tail -1
        fi
      register: cmd_model
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz revision sprzetu
      ansible.builtin.shell: |
        awk -F': ' '/Revision/ {print $2}' /proc/cpuinfo | tail -1
      register: cmd_revision
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz serial sprzetu
      ansible.builtin.shell: |
        awk -F': ' '/Serial/ {print $2}' /proc/cpuinfo | tail -1
      register: cmd_serial
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz wersje systemu Linux
      ansible.builtin.shell: |
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          echo "$PRETTY_NAME"
        else
          uname -a
        fi
      register: cmd_linux
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz wersje kernela
      ansible.builtin.command: uname -r
      register: cmd_kernel
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz architekture
      ansible.builtin.command: uname -m
      register: cmd_arch
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz firmware bootloadera Raspberry Pi
      ansible.builtin.shell: |
        if command -v rpi-eeprom-update >/dev/null 2>&1; then
          rpi-eeprom-update 2>/dev/null | sed 's/\r//g'
        elif command -v vcgencmd >/dev/null 2>&1; then
          vcgencmd bootloader_version 2>/dev/null || true
        else
          echo "BRAK rpi-eeprom-update/vcgencmd"
        fi
      register: cmd_bootloader
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Pobierz firmware GPU VideoCore
      ansible.builtin.shell: |
        if command -v vcgencmd >/dev/null 2>&1; then
          vcgencmd version 2>/dev/null
        else
          echo "BRAK vcgencmd"
        fi
      register: cmd_vcgencmd
      changed_when: false
      failed_when: false
      when: ssh_check is succeeded

    - name: Ustaw raport dla hosta OK
      ansible.builtin.set_fact:
        rpi_report:
          status: "OK"
          lokalizacja: "{{ rpi_lokalizacja | trim }}"
          ip: "{{ rpi_ip }}"
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: "{{ cmd_hostname.stdout | default('') }}"
          model: "{{ cmd_model.stdout | default('') }}"
          revision: "{{ cmd_revision.stdout | default('') }}"
          serial: "{{ cmd_serial.stdout | default('') }}"
          linux: "{{ cmd_linux.stdout | default('') }}"
          kernel: "{{ cmd_kernel.stdout | default('') }}"
          arch: "{{ cmd_arch.stdout | default('') }}"
          bootloader: "{{ cmd_bootloader.stdout_lines | default([]) | join(' | ') }}"
          vcgencmd: "{{ cmd_vcgencmd.stdout_lines | default([]) | join(' | ') }}"
      when: ssh_check is succeeded

    - name: Przygotuj sciezki raportu lokalnie
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      run_once: true
      delegate_to: localhost

    - name: Ustaw katalog raportu
      ansible.builtin.set_fact:
        report_dir: "/tmp/raport_rpi_{{ report_timestamp }}"
        report_csv: "/tmp/raport_rpi_{{ report_timestamp }}/raport_rpi.csv"
        report_html: "/tmp/raport_rpi_{{ report_timestamp }}/raport_rpi.html"
      run_once: true
      delegate_to: localhost

    - name: Utworz katalog raportu na AWX
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      run_once: true
      delegate_to: localhost

    - name: Wygeneruj raport CSV na AWX
      ansible.builtin.copy:
        dest: "{{ report_csv }}"
        mode: "0644"
        content: |
          LOKALIZACJA;IP;STATUS;INVENTORY_HOSTNAME;HOSTNAME;MODEL;REVISION;SERIAL;LINUX;KERNEL;ARCH;BOOTLOADER;VCGENCMD
          {% for h in ansible_play_hosts_all %}
          {% set hv = hostvars[h] %}
          {% set ip = hv.ansible_host | default(h) %}
          {% set lok =
            'SZWALNIA DM' if ip.startswith('10.10.')
            else
            'SZWALNIA RE' if ip.startswith('10.237.')
            else
            'SZWALNIA OL' if ip.startswith('10.238.')
            else
            'INNE'
          %}
          {% set r = hv.rpi_report | default({}) %}
          {{ r.lokalizacja | default(lok) | trim }};{{ r.ip | default(ip) }};{{ r.status | default('BRAK DANYCH') }};{{ r.inventory_hostname | default(h) }};{{ r.hostname | default('') | string | replace(';', ',') }};{{ r.model | default('') | string | replace(';', ',') }};{{ r.revision | default('') | string | replace(';', ',') }};{{ r.serial | default('') | string | replace(';', ',') }};{{ r.linux | default('') | string | replace(';', ',') }};{{ r.kernel | default('') | string | replace(';', ',') }};{{ r.arch | default('') | string | replace(';', ',') }};{{ r.bootloader | default('') | string | replace(';', ',') }};{{ r.vcgencmd | default('') | string | replace(';', ',') }}
          {% endfor %}
      run_once: true
      delegate_to: localhost

    - name: Wygeneruj raport HTML na AWX
      ansible.builtin.copy:
        dest: "{{ report_html }}"
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <title>Raport Raspberry Pi</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                font-size: 13px;
                background: #f4f4f4;
                margin: 20px;
              }

              h1 {
                margin: 0 0 6px 0;
                font-size: 22px;
              }

              .info {
                margin-bottom: 15px;
                color: #555;
              }

              table {
                border-collapse: collapse;
                width: 100%;
                background: #fff;
              }

              th,
              td {
                border: 1px solid #ccc;
                padding: 6px 8px;
                vertical-align: top;
              }

              th {
                background: #222;
                color: #fff;
                position: sticky;
                top: 0;
                z-index: 2;
              }

              tr:nth-child(even) {
                background: #f0f0f0;
              }

              .ok {
                color: green;
                font-weight: bold;
              }

              .bad {
                color: red;
                font-weight: bold;
              }

              .small {
                font-size: 11px;
                max-width: 520px;
                word-break: break-word;
              }

              .nowrap {
                white-space: nowrap;
              }
            </style>
          </head>
          <body>
            <h1>Raport Raspberry Pi</h1>
            <div class="info">
              Plik wygenerowany przez AWX / Ansible.
            </div>

            <table>
              <thead>
                <tr>
                  <th>Lokalizacja</th>
                  <th>IP</th>
                  <th>Status</th>
                  <th>Inventory host</th>
                  <th>Hostname</th>
                  <th>Model</th>
                  <th>Revision</th>
                  <th>Serial</th>
                  <th>Linux</th>
                  <th>Kernel</th>
                  <th>Arch</th>
                  <th>Bootloader / EEPROM</th>
                  <th>Firmware vcgencmd</th>
                </tr>
              </thead>
              <tbody>
              {% for h in ansible_play_hosts_all %}
                {% set hv = hostvars[h] %}
                {% set ip = hv.ansible_host | default(h) %}
                {% set lok =
                  'SZWALNIA DM' if ip.startswith('10.10.')
                  else
                  'SZWALNIA RE' if ip.startswith('10.237.')
                  else
                  'SZWALNIA OL' if ip.startswith('10.238.')
                  else
                  'INNE'
                %}
                {% set r = hv.rpi_report | default({}) %}
                {% set status = r.status | default('BRAK DANYCH') %}
                <tr>
                  <td class="nowrap">{{ r.lokalizacja | default(lok) | trim }}</td>
                  <td class="nowrap">{{ r.ip | default(ip) }}</td>
                  <td class="{{ 'ok' if status == 'OK' else 'bad' }}">{{ status }}</td>
                  <td>{{ r.inventory_hostname | default(h) }}</td>
                  <td>{{ r.hostname | default('') }}</td>
                  <td>{{ r.model | default('') }}</td>
                  <td>{{ r.revision | default('') }}</td>
                  <td>{{ r.serial | default('') }}</td>
                  <td>{{ r.linux | default('') }}</td>
                  <td>{{ r.kernel | default('') }}</td>
                  <td>{{ r.arch | default('') }}</td>
                  <td class="small">{{ r.bootloader | default('') }}</td>
                  <td class="small">{{ r.vcgencmd | default('') }}</td>
                </tr>
              {% endfor %}
              </tbody>
            </table>
          </body>
          </html>
      run_once: true
      delegate_to: localhost

    - name: Pokaz sciezki raportu
      ansible.builtin.debug:
        msg:
          - "Raport CSV:  {{ report_csv }}"
          - "Raport HTML: {{ report_html }}"
      run_once: true
      delegate_to: localhost

    - name: Zapisz sciezki raportu jako AWX artifacts
      ansible.builtin.set_stats:
        data:
          raport_rpi_csv: "{{ report_csv }}"
          raport_rpi_html: "{{ report_html }}"
      run_once: true
      delegate_to: localhost
