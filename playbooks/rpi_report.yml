---
- name: Raport Raspberry Pi - firmware, sprzet, Linux
  hosts: all
  gather_facts: false
  become: false
  ignore_unreachable: true

  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ServerAliveInterval=5 -o ServerAliveCountMax=1"
    ansible_command_timeout: 20

  tasks:
    - name: Ustal IP i lokalizacje lokalnie
      ansible.builtin.set_fact:
        rpi_ip: "{{ ansible_host | default(inventory_hostname) }}"
        rpi_lokalizacja: >-
          {% set ip = ansible_host | default(inventory_hostname) %}
          {% if ip.startswith('10.10.') %}
          SZWALNIA DM
          {% elif ip.startswith('10.237.') %}
          SZWALNIA RE
          {% elif ip.startswith('10.238.') %}
          SZWALNIA OL
          {% else %}
          INNE
          {% endif %}

    - name: Sprawdz lokalnie czy port SSH odpowiada
      ansible.builtin.wait_for:
        host: "{{ rpi_ip }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 5
        connect_timeout: 3
        state: started
      register: ssh_port_check
      ignore_errors: true
      delegate_to: localhost

    - name: Ustaw status portu SSH
      ansible.builtin.set_fact:
        rpi_ssh_port_open: "{{ ssh_port_check is succeeded }}"

    - name: Ustaw domyslny raport dla hosta
      ansible.builtin.set_fact:
        rpi_report:
          status: "{{ 'PORT SSH OK' if rpi_ssh_port_open | bool else 'BRAK SSH' }}"
          lokalizacja: "{{ rpi_lokalizacja | trim }}"
          ip: "{{ rpi_ip }}"
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: ""
          model: ""
          revision: ""
          serial: ""
          linux: ""
          kernel: ""
          arch: ""
          bootloader: ""
          vcgencmd: ""

    - name: Zbierz dane z RPi jednym poleceniem READ ONLY
      ansible.builtin.raw: |
        set +e

        echo "HOSTNAME=$(hostname 2>/dev/null)"

        if [ -r /proc/device-tree/model ]; then
          MODEL=$(tr -d '\0' < /proc/device-tree/model)
        else
          MODEL=$(awk -F': ' '/Model/ {print $2}' /proc/cpuinfo | tail -1)
        fi
        echo "MODEL=$MODEL"

        REVISION=$(awk -F': ' '/Revision/ {print $2}' /proc/cpuinfo | tail -1)
        echo "REVISION=$REVISION"

        SERIAL=$(awk -F': ' '/Serial/ {print $2}' /proc/cpuinfo | tail -1)
        echo "SERIAL=$SERIAL"

        if [ -r /etc/os-release ]; then
          . /etc/os-release
          echo "LINUX=$PRETTY_NAME"
        else
          echo "LINUX=$(uname -a)"
        fi

        echo "KERNEL=$(uname -r 2>/dev/null)"
        echo "ARCH=$(uname -m 2>/dev/null)"

        if command -v vcgencmd >/dev/null 2>&1; then
          BOOTLOADER=$(vcgencmd bootloader_version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')
        else
          BOOTLOADER="BRAK vcgencmd"
        fi
        echo "BOOTLOADER=$BOOTLOADER"

        if command -v vcgencmd >/dev/null 2>&1; then
          VCGENCMD=$(vcgencmd version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')
        else
          VCGENCMD="BRAK vcgencmd"
        fi
        echo "VCGENCMD=$VCGENCMD"
      register: rpi_collect
      changed_when: false
      failed_when: false
      ignore_errors: true
      ignore_unreachable: true
      when: rpi_ssh_port_open | bool

    - name: Ustaw raport dla hosta z bledem SSH
      ansible.builtin.set_fact:
        rpi_report:
          status: "BLAD SSH"
          lokalizacja: "{{ rpi_lokalizacja | trim }}"
          ip: "{{ rpi_ip }}"
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: ""
          model: ""
          revision: ""
          serial: ""
          linux: ""
          kernel: ""
          arch: ""
          bootloader: ""
          vcgencmd: ""
      when:
        - rpi_ssh_port_open | bool
        - rpi_collect is defined
        - rpi_collect.unreachable | default(false)

    - name: Ustaw raport dla hosta OK
      ansible.builtin.set_fact:
        rpi_report:
          status: "OK"
          lokalizacja: "{{ rpi_lokalizacja | trim }}"
          ip: "{{ rpi_ip }}"
          inventory_hostname: "{{ inventory_hostname }}"
          hostname: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^HOSTNAME=(.*)$') | first | default('') }}"
          model: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^MODEL=(.*)$') | first | default('') }}"
          revision: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^REVISION=(.*)$') | first | default('') }}"
          serial: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^SERIAL=(.*)$') | first | default('') }}"
          linux: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^LINUX=(.*)$') | first | default('') }}"
          kernel: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^KERNEL=(.*)$') | first | default('') }}"
          arch: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^ARCH=(.*)$') | first | default('') }}"
          bootloader: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^BOOTLOADER=(.*)$') | first | default('') }}"
          vcgencmd: "{{ rpi_collect.stdout | default('') | regex_findall('(?m)^VCGENCMD=(.*)$') | first | default('') }}"
      when:
        - rpi_ssh_port_open | bool
        - rpi_collect is defined
        - not rpi_collect.unreachable | default(false)

    - name: Ustaw timestamp raportu
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
      run_once: true
      delegate_to: localhost

    - name: Ustaw sciezki raportu
      ansible.builtin.set_fact:
        report_dir: "/var/lib/awx/projects/raporty/raport_rpi_{{ report_timestamp }}"
        report_csv: "/var/lib/awx/projects/raporty/raporty_rpi_{{ report_timestamp }}/raport_rpi.csv"
        report_html: "/var/lib/awx/projects/raporty/raporty_rpi_{{ report_timestamp }}/raport_rpi.html"
      run_once: true
      delegate_to: localhost

    - name: Popraw sciezki raportu
      ansible.builtin.set_fact:
        report_dir: "/var/lib/awx/projects/raporty/raport_rpi_{{ report_timestamp }}"
        report_csv: "/var/lib/awx/projects/raporty/raport_rpi_{{ report_timestamp }}/raport_rpi.csv"
        report_html: "/var/lib/awx/projects/raporty/raport_rpi_{{ report_timestamp }}/raport_rpi.html"
      run_once: true
      delegate_to: localhost

    - name: Utworz katalog raportu
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0777"
      run_once: true
      delegate_to: localhost

    - name: Wygeneruj raport CSV
      ansible.builtin.copy:
        dest: "{{ report_csv }}"
        mode: "0666"
        content: |
          LOKALIZACJA;IP;STATUS;INVENTORY_HOSTNAME;HOSTNAME;MODEL;REVISION;SERIAL;LINUX;KERNEL;ARCH;BOOTLOADER;VCGENCMD
          {% for h in ansible_play_hosts_all %}
          {% set hv = hostvars[h] %}
          {% set ip = hv.rpi_ip | default(hv.ansible_host | default(h)) %}
          {% set lok =
            'SZWALNIA DM' if ip.startswith('10.10.')
            else
            'SZWALNIA RE' if ip.startswith('10.237.')
            else
            'SZWALNIA OL' if ip.startswith('10.238.')
            else
            'INNE'
          %}
          {% set r = hv.rpi_report | default({}) %}
          {{ r.lokalizacja | default(lok) | trim }};{{ r.ip | default(ip) }};{{ r.status | default('BRAK DANYCH') }};{{ r.inventory_hostname | default(h) }};{{ r.hostname | default('') | string | replace(';', ',') }};{{ r.model | default('') | string | replace(';', ',') }};{{ r.revision | default('') | string | replace(';', ',') }};{{ r.serial | default('') | string | replace(';', ',') }};{{ r.linux | default('') | string | replace(';', ',') }};{{ r.kernel | default('') | string | replace(';', ',') }};{{ r.arch | default('') | string | replace(';', ',') }};{{ r.bootloader | default('') | string | replace(';', ',') }};{{ r.vcgencmd | default('') | string | replace(';', ',') }}
          {% endfor %}
      run_once: true
      delegate_to: localhost

    - name: Wygeneruj raport HTML
      ansible.builtin.copy:
        dest: "{{ report_html }}"
        mode: "0666"
        content: |
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <title>Raport Raspberry Pi</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                font-size: 13px;
                background: #f4f4f4;
                margin: 20px;
              }
              h1 {
                margin: 0 0 8px 0;
                font-size: 22px;
              }
              .info {
                margin-bottom: 15px;
                color: #555;
              }
              table {
                border-collapse: collapse;
                width: 100%;
                background: #fff;
              }
              th, td {
                border: 1px solid #ccc;
                padding: 6px 8px;
                vertical-align: top;
              }
              th {
                background: #222;
                color: #fff;
                position: sticky;
                top: 0;
                z-index: 2;
              }
              tr:nth-child(even) {
                background: #f0f0f0;
              }
              .ok {
                color: green;
                font-weight: bold;
              }
              .bad {
                color: red;
                font-weight: bold;
              }
              .small {
                font-size: 11px;
                max-width: 520px;
                word-break: break-word;
              }
              .nowrap {
                white-space: nowrap;
              }
            </style>
          </head>
          <body>
            <h1>Raport Raspberry Pi</h1>
            <div class="info">
              Wygenerowano: {{ report_timestamp }}<br>
              CSV: {{ report_csv }}<br>
              HTML: {{ report_html }}
            </div>

            <table>
              <thead>
                <tr>
                  <th>Lokalizacja</th>
                  <th>IP</th>
                  <th>Status</th>
                  <th>Inventory host</th>
                  <th>Hostname</th>
                  <th>Model</th>
                  <th>Revision</th>
                  <th>Serial</th>
                  <th>Linux</th>
                  <th>Kernel</th>
                  <th>Arch</th>
                  <th>Bootloader / EEPROM</th>
                  <th>Firmware vcgencmd</th>
                </tr>
              </thead>
              <tbody>
              {% for h in ansible_play_hosts_all %}
                {% set hv = hostvars[h] %}
                {% set ip = hv.rpi_ip | default(hv.ansible_host | default(h)) %}
                {% set lok =
                  'SZWALNIA DM' if ip.startswith('10.10.')
                  else
                  'SZWALNIA RE' if ip.startswith('10.237.')
                  else
                  'SZWALNIA OL' if ip.startswith('10.238.')
                  else
                  'INNE'
                %}
                {% set r = hv.rpi_report | default({}) %}
                {% set status = r.status | default('BRAK DANYCH') %}
                <tr>
                  <td class="nowrap">{{ r.lokalizacja | default(lok) | trim }}</td>
                  <td class="nowrap">{{ r.ip | default(ip) }}</td>
                  <td class="{{ 'ok' if status == 'OK' else 'bad' }}">{{ status }}</td>
                  <td>{{ r.inventory_hostname | default(h) }}</td>
                  <td>{{ r.hostname | default('') }}</td>
                  <td>{{ r.model | default('') }}</td>
                  <td>{{ r.revision | default('') }}</td>
                  <td>{{ r.serial | default('') }}</td>
                  <td>{{ r.linux | default('') }}</td>
                  <td>{{ r.kernel | default('') }}</td>
                  <td>{{ r.arch | default('') }}</td>
                  <td class="small">{{ r.bootloader | default('') }}</td>
                  <td class="small">{{ r.vcgencmd | default('') }}</td>
                </tr>
              {% endfor %}
              </tbody>
            </table>
          </body>
          </html>
      run_once: true
      delegate_to: localhost

    - name: Pokaz zestawienie w AWX Output
      ansible.builtin.debug:
        msg: |
          ================= RAPORT RASPBERRY PI =================
          LOKALIZACJA;IP;STATUS;INVENTORY_HOSTNAME;HOSTNAME;MODEL;REVISION;SERIAL;LINUX;KERNEL;ARCH
          {% for h in ansible_play_hosts_all %}
          {% set hv = hostvars[h] %}
          {% set ip = hv.rpi_ip | default(hv.ansible_host | default(h)) %}
          {% set lok =
            'SZWALNIA DM' if ip.startswith('10.10.')
            else
            'SZWALNIA RE' if ip.startswith('10.237.')
            else
            'SZWALNIA OL' if ip.startswith('10.238.')
            else
            'INNE'
          %}
          {% set r = hv.rpi_report | default({}) %}
          {{ r.lokalizacja | default(lok) | trim }};{{ r.ip | default(ip) }};{{ r.status | default('BRAK DANYCH') }};{{ r.inventory_hostname | default(h) }};{{ r.hostname | default('') }};{{ r.model | default('') }};{{ r.revision | default('') }};{{ r.serial | default('') }};{{ r.linux | default('') }};{{ r.kernel | default('') }};{{ r.arch | default('') }}
          {% endfor %}
          ========================================================
      run_once: true
      delegate_to: localhost

    - name: Pokaz sciezki raportu
      ansible.builtin.debug:
        msg:
          - "Raport CSV:  {{ report_csv }}"
          - "Raport HTML: {{ report_html }}"
      run_once: true
      delegate_to: localhost

    - name: Zapisz sciezki raportu do AWX Artifacts
      ansible.builtin.set_stats:
        data:
          raport_rpi_csv: "{{ report_csv }}"
          raport_rpi_html: "{{ report_html }}"
      run_once: true
      delegate_to: localhost
